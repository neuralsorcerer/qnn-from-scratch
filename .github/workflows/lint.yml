name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Capture Black diff
        run: black --diff . > black.diff || true
      - name: Upload Black diff
        uses: actions/upload-artifact@v7
        with:
          name: black-diff
          path: black.diff
      - name: Black
        run: black --check .
      - name: Isort
        run: isort --diff --check-only .
      - name: Mypy
        run: mypy

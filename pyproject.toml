[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qnn-from-scratch"
version = "0.1.0"
description = "An educational Quantum Neural Network implemented from scratch with NumPy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Soumyadip Sarkar"}]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit>=3.8.0",
    "isort>=5.13.0",
    "black>=24.8.0",
    "mypy>=1.11.0"
]

[project.scripts]
qnn = "qnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests", "examples"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '(\.venv|build|dist)/'

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src", "tests", "examples"]
